services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruach
      POSTGRES_PASSWORD: ruach
      POSTGRES_DB: ruach_dev
    ports:
      - "5432:5432"
    volumes:
      - ruach_postgres_data:/var/lib/postgresql/data

volumes:
  ruach_postgres_data:
