name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No live database is needed here -- packages/database's tests are pure unit tests
# (no live queries), scripts/check-tenant-scoping.sh is static grep analysis, and the
# dashboard build renders every dashboard/prayer/widget route dynamically (server-
# rendered on demand) rather than statically at build time, so it never actually
# connects to DATABASE_URL during `next build`. These placeholder values just need to
# be syntactically present so Prisma client generation and module-level env reads
# don't throw -- they're never used to reach a real database.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-placeholder-secret"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned via package.json's packageManager field) requires
          # Node >=22.13 -- the app's own engines field only floors at >=20, but
          # that's not enough to satisfy pnpm itself.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Tenant-scoping check
        run: bash scripts/check-tenant-scoping.sh

      - name: Build dashboard
        run: pnpm --filter @ruach/dashboard build

  e2e:
    runs-on: ubuntu-latest
    # Unlike the `ci` job above, the Playwright suite genuinely needs a live database:
    # golden-path.spec.ts creates its own org/user via the service layer and imports a
    # mock resource, and tenant-isolation.spec.ts requires seeded data (it looks up the
    # "riverside-demo" org and throws a clear error if `pnpm db:seed` hasn't run).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruach
          POSTGRES_PASSWORD: ruach
          POSTGRES_DB: ruach_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ruach:ruach@localhost:5432/ruach_dev"
      DIRECT_DATABASE_URL: "postgresql://ruach:ruach@localhost:5432/ruach_dev"
      AUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3100"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @ruach/database exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      # The browser binary download (from Playwright's CDN) is what's actually slow/
      # flaky, not the OS package install below it -- this cache turns a ~20-90min
      # stall (observed twice) into a no-network cache hit on every run after the
      # first for a given Playwright version. GitHub Actions runners are fresh VMs
      # every run, so OS packages can never be cached this way -- install-deps (apt,
      # not CDN) always runs regardless of cache-hit.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.1-${{ runner.os }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ruach/dashboard exec playwright install chromium

      - name: Install Playwright OS dependencies
        run: pnpm --filter @ruach/dashboard exec playwright install-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @ruach/dashboard test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7
